apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: urlshort
  labels: { app: analytics }
spec:
  replicas: 2
  selector:
    matchLabels: { app: analytics }
  template:
    metadata:
      labels: { app: analytics }
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: analytics
          image: urlshort/analytics:1.0
          imagePullPolicy: IfNotPresent
          # Keep serving for a few seconds after deletion starts, so the pod is removed from the
          # Service endpoints before it stops accepting connections (zero-downtime scale-in/updates).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            periodSeconds: 5
            failureThreshold: 2
          # Gives the app up to 3 min to boot (e.g. while Postgres starts) before liveness checks begin.
          startupProbe:
            httpGet: { path: /live, port: 3003 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /live, port: 3003 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: urlshort
spec:
  selector: { app: analytics }
  ports:
    - port: 3003
      targetPort: 3003
