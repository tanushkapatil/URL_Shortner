# Autoscaling: Kubernetes adds/removes pods based on CPU usage.
# Requires metrics-server (see README).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redirect
  namespace: urlshort
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redirect
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortener
  namespace: urlshort
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortener
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    # Ignore short CPU spikes (e.g. a new pod warming up) instead of reacting to them.
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
